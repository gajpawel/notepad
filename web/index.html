<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
   <meta name="permissions-policy" content="microphone=()">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="notepad">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Noteable</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/tesseract.js@v5.1.0/dist/tesseract.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="permissions-policy" content="microphone=*">
  
  <script>
    window.addEventListener('load', function(ev) {
      // Sprawdź wsparcie dla Web Speech API
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        console.log('Speech Recognition API jest dostępne');
      } else {
        console.warn('Speech Recognition API nie jest dostępne w tej przeglądarce');
      }
      
      // Poproś o uprawnienia do mikrofonu przy starcie (opcjonalne)
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(function(stream) {
            console.log('Uprawnienia do mikrofonu przyznane');
            stream.getTracks().forEach(track => track.stop()); // Zatrzymaj stream
          })
          .catch(function(err) {
            console.log('Brak uprawnień do mikrofonu:', err);
          });
      }
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
