name: Noteable
description: "Now you're able to Note. Noteable."

# Prevent accidental publishing
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:    
    sdk: flutter
  shared_preferences: ^2.2.0
  archive: ^3.3.7
  cupertino_icons: ^1.0.8
  fluttertoast: ^8.2.8
  intl: 0.20.2
  path_provider: ^2.1.5
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  js: ^0.6.5
  process_run: ^1.2.4
  file_picker: ^8.1.3
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  google_fonts: ^6.1.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  flutter_quill: ^11.4.1
  web: 1.1.1
  firebase_auth: ^5.3.1
  pdf: ^3.10.4
  printing: ^5.11.0
  flutter_quill_to_pdf: ^2.3.7
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

# App icon configuration (now at root level)
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#4a148c"
    theme_color: "#4a148c"
  windows:
    generate: true
    image_path: "assets/icons/icon.png"
  macos:
    generate: true
    image_path: "assets/icons/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/Roboto-Regular.ttf

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700